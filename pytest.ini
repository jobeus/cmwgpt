[pytest]
# `make test` and CI run pytest, so unittest-style and function-style tests both run.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -q
    --tb=short
    --strict-markers
    --disable-warnings
    -p no:cacheprovider

asyncio_mode = auto

markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    network: Tests that require network access

minversion = 7.0
