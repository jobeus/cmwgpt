name: Dependabot auto-merge

# Merges a Dependabot PR once CI has passed on it, then re-runs CI on main so its deploy job
# tells the bot to update. (A merge made with GITHUB_TOKEN fires no push workflows itself;
# workflow_dispatch is the exception.)
on:
  workflow_run:
    workflows: ["Continuous Integration"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    steps:
    - name: Merge PR
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        BRANCH: ${{ github.event.workflow_run.head_branch }}
        SHA: ${{ github.event.workflow_run.head_sha }}
      run: |
        pr=$(gh pr list --head "$BRANCH" --author 'app/dependabot' --state open --json number --jq '.[0].number')
        if [ -z "$pr" ]; then
          echo "No open Dependabot PR for $BRANCH"
          exit 0
        fi
        # --match-head-commit: only merge the commit CI actually tested.
        gh pr merge "$pr" --squash --delete-branch --match-head-commit "$SHA"

    - name: Deploy via CI on main
      # Only Python dependency bumps change what the bot runs.
      if: startsWith(github.event.workflow_run.head_branch, 'dependabot/pip/')
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
      run: gh workflow run ci.yml --ref main
