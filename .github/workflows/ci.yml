name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt', '**/test_requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m venv .venv
        .venv/bin/python -m pip install --upgrade pip
        .venv/bin/python -m pip install -r requirements.txt
        .venv/bin/python -m pip install -r test_requirements.txt

    - name: Run Python lint, typecheck, and tests
      run: |
        make lint
        make typecheck
        make test

  log-viewer-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: log-viewer/backend
    steps:
    - uses: actions/checkout@v4

    - name: Install PAM headers
      run: sudo apt-get update && sudo apt-get install -y libpam0g-dev

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: log-viewer/backend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Build backend
      run: npm run build

    - name: Lint backend
      run: npm run lint

    - name: Test backend
      run: npm run test

  log-viewer-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: log-viewer/frontend
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: log-viewer/frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Build frontend
      run: npm run build

    - name: Lint frontend
      run: npm run lint

    - name: Test frontend
      run: npm run test
