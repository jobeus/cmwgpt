name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.13]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/test_requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r test_requirements.txt

    - name: Lint with flake8
      run: |
        # Install flake8 if not already installed
        pip install flake8
        # Run linting
        make lint

    - name: Run tests
      run: |
        make test

    - name: Generate coverage report
      run: |
        # Install coverage tools if pytest is available
        if command -v pytest &> /dev/null; then
          pip install coverage pytest-cov
          # Run tests with coverage using pytest
          python -m pytest tests/ --cov=. --cov-report=xml --cov-report=term-missing
        else
          echo "pytest not available, skipping coverage report"
        fi

    - name: Upload coverage to Codecov
      if: success()
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  lint-only:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Install linting dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 autopep8

    - name: Check code formatting
      run: |
        make lint

    - name: Check if autofix would make changes
      run: |
        # Create a copy of the current state
        cp -r . /tmp/original
        # Run autofix
        make autofix
        # Check if anything changed
        if ! diff -r . /tmp/original --exclude=.git --exclude=__pycache__ > /dev/null; then
          echo "❌ Code formatting issues found. Run 'make autofix' locally and commit the changes."
          echo "Files that would be changed:"
          diff -r . /tmp/original --exclude=.git --exclude=__pycache__ || true
          exit 1
        else
          echo "✅ Code formatting is correct"
        fi
