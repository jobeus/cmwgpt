server {
    listen 80;
    server_name polar.jobe.wtf;

    # Redirect all HTTP requests to HTTPS with a 301 Moved Permanently response.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name polar.jobe.wtf;

    # Certificate configuration (assuming you use standard certbot paths)
    # ssl_certificate /etc/letsencrypt/live/polar.jobe.wtf/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/polar.jobe.wtf/privkey.pem;

    # Frontend (built dist)
    # Serve static files from the Vite build
    # Assuming the app is built to `/Users/jobe/dev/cmwgpt/log-viewer/frontend/dist`
    # You may want to run "npm run build" in the frontend directory
    location / {
        root /Users/jobe/dev/cmwgpt/log-viewer/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Backend API endpoints
    location /api/ {
        proxy_pass http://localhost:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket connection for Socket.io
    location /socket.io/ {
        proxy_pass http://localhost:3001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400; # Prevent websocket from dropping due to inactivity
    }
}
